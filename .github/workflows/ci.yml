name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  smoke-scan:
    runs-on: ubuntu-latest
    needs: lint-build-test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Run Ledgerful PR scan (smoke)
        uses: ./
        with:
          ledgerful-version: v0.1.8
          ledgerful-checksum: ${{ vars.LEDGERFUL_LINUX_CHECKSUM }}
        env:
          LEDGERFUL_NO_NETWORK: "1"