name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4 — pin to a specific SHA in production.
      - uses: actions/checkout@<pinned-sha>
      # actions/setup-node@v4 — pin to a specific SHA in production.
      - uses: actions/setup-node@<pinned-sha>
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  smoke-scan:
    runs-on: ubuntu-latest
    needs: lint-build-test
    permissions:
      contents: read
    steps:
      # actions/checkout@v4 — pin to a specific SHA in production.
      - uses: actions/checkout@<pinned-sha>
        with:
          fetch-depth: 0
      # actions/setup-node@v4 — pin to a specific SHA in production.
      - uses: actions/setup-node@<pinned-sha>
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      # This job requires a repository variable LEDGERFUL_LINUX_CHECKSUM containing the SHA-256 of
      # the pinned v0.1.8 Linux x86_64 release binary. Set it in the repo's Settings > Variables.
      - name: Run Ledgerful PR scan (smoke)
        uses: ./
        with:
          ledgerful-version: v0.1.8
          ledgerful-checksum: ${{ vars.LEDGERFUL_LINUX_CHECKSUM }}
        env:
          LEDGERFUL_NO_NETWORK: "1"