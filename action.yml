name: Ledgerful PR Risk Report
description: Runs the real Ledgerful engine binary in your runner over a PR diff and posts a signed change-risk summary as a PR comment / check-run. Same engine you run locally — there is no Ledgerful server in the loop.
author: Ledgerful, LLC
branding:
  icon: shield
  color: blue

inputs:
  ledgerful-version:
    description: Pinned Ledgerful engine release version to run (e.g. v0.1.8). Not `latest` — supply-chain hygiene.
    required: false
    default: 'v0.1.8'
  ledgerful-checksum:
    description: SHA-256 checksum of the pinned release binary for the runner's OS/arch. Verified before exec, even on cache hit. Required in Workflow A (scan); harmless in Workflow B.
    required: true
  github-token:
    description: GITHUB_TOKEN used to authenticate the release download in Workflow A and to post the PR comment / check-run in Workflow B. Workflow A should run with permissions contents read only; Workflow B uses pull-requests write + checks write.
    required: false
    default: ${{ github.token }}
  fail-on:
    description: Optional non-blocking fail condition (low|medium|high). Reporting only — policy enforcement is out of scope here.
    required: false
    default: ''

outputs:
  report-path:
    description: Path to the JSON report written by Workflow A.
  risk-level:
    description: Risk level reported by the scan (low, medium, high).

runs:
  using: node24
  main: dist/index.js