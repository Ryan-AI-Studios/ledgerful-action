# Workflow A — Ledgerful PR Scan
# Runs the real Ledgerful engine binary in the runner over the untrusted PR diff.
# Read-only. No write token, no secrets. Uploads the JSON report as an artifact.
#
# Fork-PR safe: untrusted code only ever runs here, with nothing it can abuse.
# Workflow B (ledgerful-pr-report.yml) consumes the artifact and posts the comment.
#
# IMPORTANT: actions/checkout MUST use fetch-depth: 0 (default 1 omits the base commit,
# so `ledgerful scan --pr <base>...<head>` can't compute the diff).
#
# The checksum below is for ledgerful-x86_64-unknown-linux-gnu.tar.gz from v0.2.10
# (published .sha256 sidecar). For other runners, substitute the matching checksum:
# https://github.com/Ryan-AI-Studios/Ledgerful/releases/tag/v0.2.10

name: Ledgerful PR Scan

on:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR (full history required for diff)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # Optional: add an actions/cache step keyed on <version>:<checksum> for cross-run
      # binary persistence on ephemeral hosted runners (tool-cache already provides
      # runner-local persistence via RUNNER_TOOL_CACHE; see "Optional cross-run binary cache" in README).
      - name: Run Ledgerful PR risk scan
        id: ledgerful-scan
        # No mutable release tag yet — pin the full commit SHA from
        # https://github.com/Ryan-AI-Studios/ledgerful-action (main).
        uses: Ryan-AI-Studios/ledgerful-action@f900ead4d7a3d6d9162b393094492b5d5fe10578
        with:
          ledgerful-version: v0.2.10
          ledgerful-checksum: 817debe3fa56db93aeb1273b1648a2b6370a50f3c69150caf8cdc423d9c1930d
        env:
          LEDGERFUL_NO_NETWORK: "1"

      - name: Upload JSON report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ledgerful-pr-report
          path: ledgerful-pr-report.json