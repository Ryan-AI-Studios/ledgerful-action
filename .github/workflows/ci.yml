name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Verify dist is fresh
        run: |
          git diff --exit-code -- dist/ || (echo "dist/index.js is stale — run 'npm run build' and commit the result" && exit 1)
      - run: npm test

  # Smoke-scan: end-to-end test that the Action downloads, verifies, and runs the real
  # engine binary against this PR's diff. Pins v0.1.9 which includes `scan --pr`
  # (engine PR #17 / track 0047). Blocking — checksum from published .sha256 sidecar.
  smoke-scan:
    runs-on: ubuntu-latest
    needs: lint-build-test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Run Ledgerful PR scan (smoke)
        uses: ./
        with:
          ledgerful-version: v0.1.9
          ledgerful-checksum: ${{ vars.LEDGERFUL_LINUX_CHECKSUM || 'ab203f8de80597dcd8294c3e87a2198113428c7a5d39cecaf8a37ce36f1a01ff' }}
        env:
          LEDGERFUL_NO_NETWORK: "1"