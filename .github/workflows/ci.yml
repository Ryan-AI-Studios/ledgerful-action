name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Verify dist is fresh
        run: |
          git diff --exit-code -- dist/ || (echo "dist/index.js is stale — run 'npm run build' and commit the result" && exit 1)
      - run: npm test

  # Smoke-scan: end-to-end test that the Action downloads, verifies, and runs the real
  # engine binary against this PR's diff. Pins published Latest v0.2.11 + Linux gnu
  # sidecar first field; scan --pr exists on this engine. Blocking. Checksum is the
  # sidecar first field directly — no vars fallback (unknown vars value is a drift trap).
  smoke-scan:
    runs-on: ubuntu-latest
    needs: lint-build-test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Run Ledgerful PR scan (smoke)
        uses: ./
        with:
          ledgerful-version: v0.2.11
          ledgerful-checksum: 5c26c34db4cc50f51a6ff0cf129ad5c175c35716941f7c6354b47f3d7aa12e1a
        env:
          LEDGERFUL_NO_NETWORK: "1"