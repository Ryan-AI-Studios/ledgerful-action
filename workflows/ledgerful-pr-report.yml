# Workflow B — Ledgerful PR Report
# Runs in the BASE-REPO context (workflow_run on A's completion) with a write token.
# Downloads A's artifact and posts the comment / check-run.
# NEVER checks out or executes PR code — only consumes the sanitized JSON.
#
# Together with ledgerful-pr-scan.yml this is the fork-PR-safe two-workflow pattern.
# `pull_request_target`-with-checkout is forbidden (RCE footgun).

name: Ledgerful PR Report

on:
  workflow_run:
    workflows: [Ledgerful PR Scan]
    types: [completed]

permissions:
  # actions:read is required to download artifacts from another workflow run
  # (Workflow A) when using a restricted GITHUB_TOKEN + github-token input.
  actions: read
  pull-requests: write
  checks: write

jobs:
  post:
    # Only post when Workflow A completed successfully. A failed A that still
    # uploaded a partial artifact must not produce a "success-looking" comment.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download the PR scan artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ledgerful-pr-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Post risk summary
        # No mutable release tag yet — pin the full commit SHA from
        # https://github.com/Ryan-AI-Studios/ledgerful-action (main).
        uses: Ryan-AI-Studios/ledgerful-action@bacf400797142884c46e97c6ce755b7ef7433a53
        with:
          github-token: ${{ github.token }}
          report-path: ledgerful-pr-report.json