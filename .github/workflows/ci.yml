name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Verify dist is fresh
        run: |
          git diff --exit-code -- dist/ || (echo "dist/index.js is stale — run 'npm run build' and commit the result" && exit 1)
      - run: npm test

  # Smoke-scan: end-to-end test that the Action downloads, verifies, and runs the real
  # engine binary against this PR's diff. Currently NON-BLOCKING (continue-on-error) because
  # the v0.1.8 release binary predates the `scan --pr` feature (engine slice PR #17 merged
  # to main but not yet released). Once a new engine release (v0.1.9+) is cut with `scan --pr`,
  # bump the version + checksum here and remove `continue-on-error`.
  smoke-scan:
    runs-on: ubuntu-latest
    needs: lint-build-test
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Run Ledgerful PR scan (smoke)
        uses: ./
        with:
          ledgerful-version: v0.1.8
          ledgerful-checksum: ${{ vars.LEDGERFUL_LINUX_CHECKSUM || '0ecba8040149f351448362bad3ea3ec940a59cf9fc719b90b7d6f2ac2649341a' }}
        env:
          LEDGERFUL_NO_NETWORK: "1"